<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24180E" />
      <stop offset="50%" stop-color="#18100A" />
      <stop offset="100%" stop-color="#0E0805" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="35%" stop-color="#F3C363" />
      <stop offset="70%" stop-color="#D9A441" />
      <stop offset="100%" stop-color="#A6731B" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9A441" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#24180E" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.6" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#innerGlow)" />

  <!-- Artisan Gold Star / Sparkle at Top Right -->
  <path d="M370 120 Q370 145 395 145 Q370 145 370 170 Q370 145 345 145 Q370 145 370 120 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="370" cy="145" r="3" fill="#FFF8E7" />

  <!-- Monogram Logo: LM (La Miette) -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <path d="M140 160 L185 160 C185 240 185 285 185 315 C185 328 192 332 205 332 L260 332 C265 332 268 335 268 340 L265 352 C265 356 260 358 255 358 L145 358 C135 358 130 352 130 342 L130 175 C130 165 134 160 140 160 Z" />
    <path d="M260 358 L285 165 C286 160 292 156 298 156 L325 156 C332 156 338 160 342 166 L368 255 L395 166 C399 160 405 156 412 156 L438 156 C445 156 450 161 448 168 L420 358 C419 364 413 368 406 368 L385 368 C378 368 373 364 372 358 L388 235 L355 345 C353 351 347 355 341 355 L328 355 C322 355 317 351 315 345 L280 235 L295 358 C296 364 291 368 284 368 L268 368 C262 368 258 364 260 358 Z" />
  </g>

  <text x="256" y="425" text-anchor="middle" fill="#E8AB48" font-family="'Times New Roman', serif" font-size="28" font-weight="bold" letter-spacing="8" opacity="0.9">
    LA MIETTE
  </text>
  <text x="256" y="455" text-anchor="middle" fill="#D9A441" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="600" letter-spacing="6" opacity="0.75">
    DHAKA
  </text>
</svg>
