<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Belgian Noir Cocoa Background -->
    <radialGradient id="cocoaRadial" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#26170E" />
      <stop offset="65%" stop-color="#140C07" />
      <stop offset="100%" stop-color="#0A0503" />
    </radialGradient>

    <!-- 24K Royal Gold Leaf Gradient -->
    <linearGradient id="royalGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF6DC" />
      <stop offset="25%" stop-color="#F3CC77" />
      <stop offset="55%" stop-color="#D1A242" />
      <stop offset="85%" stop-color="#9C7022" />
      <stop offset="100%" stop-color="#734B0B" />
    </linearGradient>

    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Luxury Rounded Square Base -->
  <rect width="512" height="512" rx="112" fill="url(#cocoaRadial)" />
  
  <!-- Outer Gold Pinstripe -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#royalGold)" stroke-width="2" stroke-opacity="0.85" />
  
  <!-- Inner Delicate Inset -->
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#royalGold)" stroke-width="1" stroke-opacity="0.25" />

  <!-- Top Minimalist Gold Star Crest -->
  <g transform="translate(256, 102)" fill="url(#royalGold)" filter="url(#crispShadow)">
    <path d="M0 -20 Q0 0 20 0 Q0 0 0 20 Q0 0 -20 0 Q0 0 0 -20 Z" />
    <circle cx="-36" cy="0" r="1.8" opacity="0.6" />
    <circle cx="36" cy="0" r="1.8" opacity="0.6" />
  </g>

  <!-- Mathematically Flawless "LM" Haute-Couture Serif Monogram -->
  <g transform="translate(256, 215)" fill="url(#royalGold)" filter="url(#crispShadow)">
    <!-- Letter L -->
    <g transform="translate(-62, 0)">
      <!-- Top Serif -->
      <path d="M-40 -68 L-8 -68 L-8 -60 L-18 -60 L-18 42 L16 42 L22 22 L28 22 L28 52 L-40 52 L-40 42 L-28 42 L-28 -60 L-40 -60 Z" />
    </g>

    <!-- Letter M -->
    <g transform="translate(38, 0)">
      <!-- Left Vertical Column with Serifs -->
      <path d="M-52 -68 L-20 -68 L-20 -60 L-30 -60 L-30 42 L-18 42 L-18 52 L-52 52 L-52 42 L-40 42 L-40 -60 L-52 -60 Z" />
      <!-- Left Diagonal Stroke (Thick) -->
      <polygon points="-30,-60 -20,-60 8,28 -2,28" />
      <!-- Right Diagonal Stroke (Hairline) -->
      <polygon points="8,28 16,28 46,-60 38,-60" />
      <!-- Right Vertical Column with Serifs -->
      <path d="M36 -68 L68 -68 L68 -60 L56 -60 L56 42 L68 42 L68 52 L36 52 L36 42 L46 42 L46 -60 L36 -60 Z" />
    </g>
  </g>

  <!-- Fine Divider Hairline with Diamond -->
  <g transform="translate(256, 326)" fill="url(#royalGold)" opacity="0.85">
    <line x1="-120" y1="0" x2="-20" y2="0" stroke="url(#royalGold)" stroke-width="1.2" />
    <polygon points="0,-4.5 4.5,0 0,4.5 -4.5,0" />
    <circle cx="-12" cy="0" r="1.5" />
    <circle cx="12" cy="0" r="1.5" />
    <line x1="20" y1="0" x2="120" y2="0" stroke="url(#royalGold)" stroke-width="1.2" />
  </g>

  <!-- Primary Typography: LA MIETTE -->
  <text x="256" y="378" text-anchor="middle" fill="url(#royalGold)" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Bodoni MT', 'Georgia', serif" font-size="33" font-weight="700" letter-spacing="10" filter="url(#crispShadow)">
    LA MIETTE
  </text>

  <!-- Secondary Typography: BROWNIE -->
  <text x="256" y="424" text-anchor="middle" fill="url(#royalGold)" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Bodoni MT', 'Georgia', serif" font-size="19" font-weight="600" letter-spacing="14" opacity="0.95" filter="url(#crispShadow)">
    BROWNIE
  </text>
</svg>
