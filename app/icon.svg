<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Noir Chocolate Radiance -->
    <radialGradient id="cocoaRadial" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#28180E" />
      <stop offset="60%" stop-color="#150C07" />
      <stop offset="100%" stop-color="#080402" />
    </radialGradient>

    <!-- 24K Royal Gold Leaf Gradient -->
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E0" />
      <stop offset="25%" stop-color="#F5D07C" />
      <stop offset="55%" stop-color="#D4A446" />
      <stop offset="85%" stop-color="#A27425" />
      <stop offset="100%" stop-color="#734B0B" />
    </linearGradient>

    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Luxury Rounded Square Base -->
  <rect width="512" height="512" rx="120" fill="url(#cocoaRadial)" />
  
  <!-- Outer Solid Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#royalGold)" stroke-width="4.5" stroke-opacity="0.9" />

  <!-- Top Haute-Patisserie Star Crest -->
  <g transform="translate(256, 96)" fill="url(#royalGold)" filter="url(#crispShadow)">
    <path d="M0 -22 Q0 0 22 0 Q0 0 0 22 Q0 0 -22 0 Q0 0 0 -22 Z" />
    <circle cx="-42" cy="0" r="3" opacity="0.75" />
    <circle cx="42" cy="0" r="3" opacity="0.75" />
  </g>

  <!-- High-Fashion French Serif "LM" Monogram -->
  <g transform="translate(256, 230)" fill="url(#royalGold)" filter="url(#crispShadow)">
    <!-- Letter L -->
    <g transform="translate(-68, 0)">
      <path d="M-42 -80 L-10 -80 L-10 -70 L-22 -70 L-22 52 L26 52 L34 26 L42 26 L42 66 L-42 66 L-42 52 L-30 52 L-30 -70 L-42 -70 Z" />
    </g>

    <!-- Letter M -->
    <g transform="translate(44, 0)">
      <!-- Left Stem -->
      <path d="M-58 -80 L-24 -80 L-24 -70 L-34 -70 L-34 52 L-20 52 L-20 66 L-58 66 L-58 52 L-44 52 L-44 -70 L-58 -70 Z" />
      <!-- Left Diagonal (Thick) -->
      <polygon points="-34,-70 -22,-70 10,34 -2,34" />
      <!-- Right Diagonal (Hairline) -->
      <polygon points="10,34 18,34 50,-70 42,-70" />
      <!-- Right Stem -->
      <path d="M38 -80 L74 -80 L74 -70 L62 -70 L62 52 L74 52 L74 66 L38 66 L38 52 L48 52 L48 -70 L38 -70 Z" />
      <!-- Apex Serif Pin -->
      <polygon points="10,30 18,38 2,38" />
    </g>
  </g>

  <!-- Primary Typography: LA MIETTE -->
  <text x="256" y="372" text-anchor="middle" fill="url(#royalGold)" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Bodoni MT', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="9" filter="url(#crispShadow)">
    LA MIETTE
  </text>

  <!-- Secondary Typography: BROWNIE -->
  <text x="256" y="416" text-anchor="middle" fill="url(#royalGold)" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Bodoni MT', 'Georgia', serif" font-size="18" font-weight="600" letter-spacing="14" opacity="0.95" filter="url(#crispShadow)">
    BROWNIE
  </text>
</svg>
