<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Noir Chocolate Radiance -->
    <radialGradient id="cocoaRadial" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#26170E" />
      <stop offset="65%" stop-color="#140C07" />
      <stop offset="100%" stop-color="#0A0503" />
    </radialGradient>

    <!-- 24K Royal Gold Leaf Gradient -->
    <linearGradient id="royalGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="25%" stop-color="#F2CA72" />
      <stop offset="55%" stop-color="#CFA03E" />
      <stop offset="85%" stop-color="#996D1E" />
      <stop offset="100%" stop-color="#734B0B" />
    </linearGradient>

    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Luxury Rounded Square Base -->
  <rect width="512" height="512" rx="112" fill="url(#cocoaRadial)" />
  
  <!-- Outer Gold Pinstripe -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#royalGold)" stroke-width="2" stroke-opacity="0.85" />
  
  <!-- Inner Delicate Inset -->
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#royalGold)" stroke-width="1" stroke-opacity="0.25" />

  <!-- Top Haute-Patisserie Star Crest -->
  <g transform="translate(256, 102)" fill="url(#royalGold)" filter="url(#crispShadow)">
    <path d="M0 -20 Q0 0 20 0 Q0 0 0 20 Q0 0 -20 0 Q0 0 0 -20 Z" />
    <circle cx="-36" cy="0" r="1.8" opacity="0.6" />
    <circle cx="36" cy="0" r="1.8" opacity="0.6" />
  </g>

  <!-- True High-Fashion French Serif "LM" Monogram (Slender, High-Contrast, Elegant) -->
  <g transform="translate(256, 216)" fill="url(#royalGold)" filter="url(#crispShadow)">
    <!-- Letter L: Classic Roman Proportions with Serif Foot & Head -->
    <g transform="translate(-52, 0)">
      <!-- Vertical Stem -->
      <path d="M-38 -72 L-10 -72 L-10 -64 L-20 -64 L-20 48 L18 48 L22 28 L28 28 L28 58 L-38 58 L-38 48 L-28 48 L-28 -64 L-38 -64 Z" />
    </g>
    
    <!-- Letter M: Classical Roman Didot Anatomy (Thick Downstrokes, Hairline Upstrokes & Diagonals) -->
    <g transform="translate(42, 0)">
      <!-- Left Stem Top Serif -->
      <path d="M-62 -72 L-36 -72 L-36 -64 L-46 -64 L-46 48 L-34 48 L-34 58 L-68 58 L-68 48 L-56 48 L-56 -64 L-68 -64 Z" />
      <!-- Left Diagonal (Thick) -->
      <polygon points="-46,-64 -40,-64 4,32 -6,32" />
      <!-- Right Diagonal (Hairline) -->
      <polygon points="4,32 10,32 50,-64 42,-64" />
      <!-- Right Stem (Thick) -->
      <path d="M42 -72 L68 -72 L68 -64 L56 -64 L56 48 L68 48 L68 58 L34 58 L34 48 L46 48 L46 -64 L36 -64 Z" />
      <!-- Apex Serif Pin -->
      <polygon points="4,28 10,36 -2,36" />
    </g>

    <!-- Center Interlocking Jewel Flourish -->
    <circle cx="-5" cy="53" r="2" opacity="0.8" />
  </g>

  <!-- Fine Divider Hairline with Diamond -->
  <g transform="translate(256, 328)" fill="url(#royalGold)" opacity="0.85">
    <line x1="-125" y1="0" x2="-22" y2="0" stroke="url(#royalGold)" stroke-width="1.2" />
    <polygon points="0,-4.5 4.5,0 0,4.5 -4.5,0" />
    <circle cx="-13" cy="0" r="1.5" />
    <circle cx="13" cy="0" r="1.5" />
    <line x1="22" y1="0" x2="125" y2="0" stroke="url(#royalGold)" stroke-width="1.2" />
  </g>

  <!-- Primary Typography: LA MIETTE -->
  <text x="256" y="378" text-anchor="middle" fill="url(#royalGold)" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Bodoni MT', 'Georgia', serif" font-size="33" font-weight="700" letter-spacing="10" filter="url(#crispShadow)">
    LA MIETTE
  </text>

  <!-- Secondary Typography: BROWNIE -->
  <text x="256" y="424" text-anchor="middle" fill="url(#royalGold)" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Bodoni MT', 'Georgia', serif" font-size="19" font-weight="600" letter-spacing="14" opacity="0.95" filter="url(#crispShadow)">
    BROWNIE
  </text>
</svg>
