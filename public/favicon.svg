<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Noir Chocolate Radiance -->
    <radialGradient id="cocoaRadial" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#28180E" />
      <stop offset="60%" stop-color="#150C07" />
      <stop offset="100%" stop-color="#080402" />
    </radialGradient>

    <!-- 24K Royal Gold Leaf Gradient -->
    <linearGradient id="royalGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF8E0" />
      <stop offset="25%" stop-color="#F5D07C" />
      <stop offset="55%" stop-color="#D4A446" />
      <stop offset="85%" stop-color="#A27425" />
      <stop offset="100%" stop-color="#734B0B" />
    </linearGradient>

    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Luxury Rounded Square Base -->
  <rect width="512" height="512" rx="120" fill="url(#cocoaRadial)" />
  
  <!-- Outer Solid Gold Border (Bold enough to stay sharp at 16px) -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#royalGold)" stroke-width="6" stroke-opacity="0.9" />

  <!-- Top Haute-Patisserie Star Crest -->
  <g transform="translate(256, 108)" fill="url(#royalGold)" filter="url(#crispShadow)">
    <path d="M0 -26 Q0 0 26 0 Q0 0 0 26 Q0 0 -26 0 Q0 0 0 -26 Z" />
    <circle cx="-50" cy="0" r="3.5" opacity="0.75" />
    <circle cx="50" cy="0" r="3.5" opacity="0.75" />
  </g>

  <!-- Bold & Ultra-Crisp "LM" Monogram (Optimized for 16px–48px Google Search Favicon Visibility) -->
  <g transform="translate(256, 268)" fill="url(#royalGold)" filter="url(#crispShadow)">
    <!-- Letter L -->
    <g transform="translate(-74, 0)">
      <path d="M-44 -90 L-8 -90 L-8 -78 L-20 -78 L-20 62 L32 62 L40 32 L48 32 L48 76 L-44 76 L-44 62 L-30 62 L-30 -78 L-44 -78 Z" />
    </g>

    <!-- Letter M -->
    <g transform="translate(48, 0)">
      <path d="M-64 -90 L-26 -90 L-26 -78 L-38 -78 L-38 62 L-22 62 L-22 76 L-64 76 L-64 62 L-48 62 L-48 -78 L-64 -78 Z" />
      <polygon points="-38,-78 -24,-78 12,42 -2,42" />
      <polygon points="12,42 22,42 58,-78 48,-78" />
      <path d="M44 -90 L84 -90 L84 -78 L70 -78 L70 62 L84 62 L84 76 L44 76 L44 62 L56 62 L56 -78 L44 -78 Z" />
      <polygon points="12,38 20,46 4,46" />
    </g>
  </g>

  <!-- Subtle Bottom Brand Wordmark (Clean & Legible) -->
  <text x="256" y="420" text-anchor="middle" fill="url(#royalGold)" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Georgia', serif" font-size="26" font-weight="700" letter-spacing="8" opacity="0.9" filter="url(#crispShadow)">
    LA MIETTE
  </text>
</svg>
