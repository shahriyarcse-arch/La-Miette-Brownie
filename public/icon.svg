<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Belgian Noir Cocoa Background -->
    <linearGradient id="bgCocoa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24170E" />
      <stop offset="50%" stop-color="#170E08" />
      <stop offset="100%" stop-color="#0E0704" />
    </linearGradient>

    <!-- Ultra-Refined Metallic Gold Gradient -->
    <linearGradient id="luxGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D0" />
      <stop offset="30%" stop-color="#E7BC66" />
      <stop offset="65%" stop-color="#C58E2E" />
      <stop offset="100%" stop-color="#8F5E16" />
    </linearGradient>

    <filter id="goldGleam" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Luxury Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgCocoa)" />
  
  <!-- Outer Gold Pinstripe -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#luxGold)" stroke-width="2" stroke-opacity="0.85" />
  
  <!-- Inner Delicate Accent Inset -->
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#luxGold)" stroke-width="1" stroke-opacity="0.3" />

  <!-- Top Minimalist Gold Star Crest -->
  <g transform="translate(256, 105)" fill="url(#luxGold)" filter="url(#goldGleam)">
    <path d="M0 -22 Q0 0 22 0 Q0 0 0 22 Q0 0 -22 0 Q0 0 0 -22 Z" />
    <circle cx="-42" cy="0" r="2" opacity="0.6" />
    <circle cx="42" cy="0" r="2" opacity="0.6" />
  </g>

  <!-- Bespoke Luxury "LM" Serif Monogram (Clean, Balanced & Razor-Sharp) -->
  <g transform="translate(256, 215)" fill="url(#luxGold)" filter="url(#goldGleam)">
    <path d="M-92 -70 L-62 -70 L-62 36 C-62 44 -56 48 -44 48 L-12 48 C-8 48 -5 51 -5 56 L-8 62 C-9 66 -13 68 -18 68 L-98 68 C-104 68 -108 65 -108 59 L-108 -59 C-108 -66 -104 -70 -92 -70 Z" />
    <path d="M-18 68 L-10 -58 C-9 -64 -5 -68 3 -68 L18 -68 C25 -68 30 -64 34 -56 L62 8 L90 -56 C94 -64 99 -68 106 -68 L121 -68 C129 -68 133 -64 134 -58 L142 68 C142 74 138 78 132 78 L114 78 C108 78 104 74 104 68 L98 -16 L74 38 C71 44 67 48 60 48 L56 48 C49 48 45 44 42 38 L18 -16 L12 68 C12 74 8 78 2 78 L-12 78 C-17 78 -18 74 -18 68 Z" />
  </g>

  <!-- Divider Line with Diamond -->
  <g transform="translate(256, 325)" fill="url(#luxGold)" opacity="0.85">
    <line x1="-120" y1="0" x2="-20" y2="0" stroke="url(#luxGold)" stroke-width="1.5" />
    <polygon points="0,-5 5,0 0,5 -5,0" />
    <line x1="20" y1="0" x2="120" y2="0" stroke="url(#luxGold)" stroke-width="1.5" />
  </g>

  <!-- Brand Name: LA MIETTE -->
  <text x="256" y="375" text-anchor="middle" fill="url(#luxGold)" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="700" letter-spacing="10" filter="url(#goldGleam)">
    LA MIETTE
  </text>

  <!-- Sub-Title: BROWNIE -->
  <text x="256" y="424" text-anchor="middle" fill="url(#luxGold)" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="20" font-weight="600" letter-spacing="14" opacity="0.95" filter="url(#goldGleam)">
    BROWNIE
  </text>
</svg>
